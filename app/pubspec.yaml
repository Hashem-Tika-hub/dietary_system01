name: dietary_app
description: Smart Personalized Dietary Recommendation App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  dio: ^5.4.0

  # State management
  flutter_riverpod: ^2.4.9

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.0.0

  # Charts
  fl_chart: ^0.67.0

  # UI helpers
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# ── إعداد أيقونة التطبيق ──────────────────────────────────
# ضع صورتك (مربّعة، PNG، 1024×1024 يفضّل) في assets/icon/icon.png
# ثم شغّل: dart run flutter_launcher_icons
# راجع assets/icon/README.md للتفاصيل
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1F6F54"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/