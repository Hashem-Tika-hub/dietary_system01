name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    name: FastAPI tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run API test suite
        run: pytest -q api/tests

  postgresql-integration:
    name: PostgreSQL migrations and catalog seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dietary_ci
          POSTGRES_USER: dietary_ci
          POSTGRES_PASSWORD: dietary_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dietary_ci -d dietary_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_INTEGRATION_DATABASE_URL: postgresql+psycopg://dietary_ci:dietary_ci_password@127.0.0.1:5432/dietary_ci
      SECRET_KEY: ci-only-secret-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Verify PostgreSQL migrations and catalog synchronization
        run: pytest -q api/tests/test_postgresql_schema_integration.py

  flutter-quality:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit and widget tests
        run: flutter test test
