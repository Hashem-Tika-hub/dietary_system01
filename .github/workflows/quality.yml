name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    name: FastAPI tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run API test suite
        run: pytest -q api/tests

  postgresql-integration:
    name: PostgreSQL migration and architecture tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dietary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dietary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_TEST_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/dietary_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run PostgreSQL architecture tests
        run: pytest -q api/tests/test_postgresql_data_architecture.py

  flutter-quality:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit and widget tests
        run: flutter test test
